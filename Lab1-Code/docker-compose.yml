version: '3'

services:
  catalog-service:
    build: ./catalog-service
    ports:
      - "5000:5000"
    networks:
      - bazarnet

  order-service:
    build: ./order-service
    ports:
      - "5001:5001"
    networks:
      - bazarnet

  frontend-service:
    build: ./frontend-service
    ports:
      - "5002:5002"
    networks:
      - bazarnet

networks:
  bazarnet:
    driver: bridge